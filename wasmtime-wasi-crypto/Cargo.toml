[package]
name = "wasmtime-wasi-crypto"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true

anyhow.workspace = true
aes-gcm = "0.10.3"
rkyv = { version = "0.8.16", features = ["std"] }
boring = { version = "5.1.0" }
byteorder = "1.5.0"
chacha20poly1305 = "0.10.1"
derivative = "2.2.0"
ed25519-compact = { version = "2.3.0", features = ["x25519"] }
hkdf = "0.13.0"
hmac = "0.13.0"
k256 = { version = "0.13.4", features = ["ecdsa", "std", "pkcs8", "pem"] }
p256 = { version = "0.13.2", features = ["ecdsa", "std", "pkcs8", "pem"] }
p384 = { version = "0.13.1", features = ["ecdsa", "std", "pkcs8", "pem"] }
pqcrypto-traits = { version = "0.3.5", optional = true }
pqcrypto-kyber = { version = "0.8.1", optional = true }

rand_core = { version = "0.6.4", features = [
  "getrandom",
], package = "rand_core" }
sha2 = "0.11.0"
subtle = "2.6.1"
xoodyak = "0.8.4"
zeroize = { version = "1.8.2", features = ["derive"] }

[lints.rust]
unused_variables = "allow"
